<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Karthik Uppari, full-stack engineer building AI products">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05070f"/><stop offset=".55" stop-color="#14123a"/><stop offset="1" stop-color="#06374a"/></linearGradient>
<linearGradient id="tx" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#a5b4fc"/></linearGradient>
<radialGradient id="o1"><stop offset="0" stop-color="#6366f1" stop-opacity=".75"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
<radialGradient id="o2"><stop offset="0" stop-color="#06b6d4" stop-opacity=".65"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
<radialGradient id="o3"><stop offset="0" stop-color="#ec4899" stop-opacity=".45"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/></radialGradient>
<pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/></pattern>
<clipPath id="r"><rect width="1200" height="320" rx="20"/></clipPath>
</defs>
<g clip-path="url(#r)">
<rect width="1200" height="320" fill="url(#bg)"/><rect width="1200" height="320" fill="url(#g)"/>
<circle cx="240" cy="90" r="260" fill="url(#o1)"><animateTransform attributeName="transform" type="translate" values="0 0;80 40;0 0" dur="12s" repeatCount="indefinite"/></circle>
<circle cx="1000" cy="260" r="280" fill="url(#o2)"><animateTransform attributeName="transform" type="translate" values="0 0;-90 -30;0 0" dur="14s" repeatCount="indefinite"/></circle>
<circle cx="700" cy="20" r="200" fill="url(#o3)"><animateTransform attributeName="transform" type="translate" values="0 0;-40 50;0 0" dur="10s" repeatCount="indefinite"/></circle>
<g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.2s" dur=".9s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.2s" dur=".9s" fill="freeze"/>
<text x="70" y="140" font-size="68" font-weight="800" fill="url(#tx)" letter-spacing="-2">Karthik Uppari</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.7s" dur=".9s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.7s" dur=".9s" fill="freeze"/>
<text x="72" y="190" font-size="25" fill="#c7d2fe">Full-stack engineer building AI products, end to end</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.2s" dur=".9s" fill="freeze"/>
<rect x="70" y="222" rx="19" width="420" height="38" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".18"/>
<circle cx="94" cy="241" r="5" fill="#34d399"><animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.4;1" dur="2s" repeatCount="indefinite"/></circle>
<text x="112" y="247" font-size="16" fill="#e0e7ff" font-weight="600">Open to internships · Hyderabad · remote · SF</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.6s" dur=".9s" fill="freeze"/>
<text x="72" y="292" font-size="14" fill="#94a3b8" letter-spacing="1.5">REACT · TYPESCRIPT · NODE · LLM APIS · PYTHON · C++</text></g>
</g>
</g></svg>